spring:
    application:
        name: bank
    datasource:
        url: jdbc:postgresql://localhost:5432/postgres?currentSchema=westpac
        username: postgres
        password: password
        driver-class-name: org.postgresql.Driver
    jpa:
        properties:
            hibernate:
                dialect: org.hibernate.dialect.PostgreSQLDialect
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
